# Phase 0: PostgreSQLのみ。RedisはPhase 3で追加する。
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: lab
      POSTGRES_PASSWORD: labpass
      POSTGRES_DB: performance_lab
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lab -d performance_lab"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
